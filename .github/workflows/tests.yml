name: Playwright Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: local_ai_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d local_ai_studio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/local_ai_studio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci
        
      - name: Install Nuxt dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install fastapi uvicorn pillow selenium "psycopg[binary]"
      - name: Initialize PostgreSQL database
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              connection.execute("""
                  CREATE TABLE IF NOT EXISTS generations (
                      id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                      prompt TEXT NOT NULL,
                      steps INTEGER NOT NULL,
                      seed INTEGER NOT NULL,
                      image_path TEXT NOT NULL,
                      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                  )
              """)

          print("PostgreSQL table initialized")
          PY
      - name: Start FastAPI server
        run: |
          mkdir -p images
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Create test generation
        run: |
          curl --fail --show-error --silent \
            -X POST http://127.0.0.1:8000/generate \
            -H "Content-Type: application/json" \
            -d '{"prompt":"A robot testing the gallery","steps":8,"seed":42}'
    
      - name: Check PHP and SQLite
        run: |
          php -v
          php -m | grep -i pdo_sqlite

      - name: Start PHP server
        run: |
          nohup php -S 127.0.0.1:8001 -t php-api > php-server.log 2>&1 &

      - name: Wait for PHP API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/stats.php | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          cat php-server.log
          exit 1

      - name: Start Nuxt server for Selenium
        run: |
          nohup npm run dev --prefix frontend -- --host 127.0.0.1 > nuxt.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat nuxt.log
          exit 1
      - name: Verify SQLite database
        run: |
          test -f history.db
          python -c "import sqlite3; db = sqlite3.connect('history.db'); print('SQLite records:', db.execute('SELECT COUNT(*) FROM generations').fetchone()[0]); db.close()"
      - name: Run Playwright tests
        run: npx playwright test --workers=1 --reporter=html
      - name: Check Chrome installation
        run: |
          google-chrome --version || chromium --version || chromium-browser --version
      - name: Run Selenium tests
        run: python tests/test_gallery_selenium.py
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
