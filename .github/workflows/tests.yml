name: Playwright Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install fastapi uvicorn pillow

      - name: Start FastAPI server
        run: |
          mkdir -p images
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

    
      - name: Check PHP and SQLite
        run: |
          php -v
          php -m | grep -i pdo_sqlite

      - name: Start PHP server
        run: |
          nohup php -S 127.0.0.1:8001 -t php-api > php-server.log 2>&1 &

      - name: Wait for PHP API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/stats.php | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          cat php-server.log
          exit 1

      - name: Run Playwright tests
        run: npx playwright test --workers=1 --reporter=html
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
